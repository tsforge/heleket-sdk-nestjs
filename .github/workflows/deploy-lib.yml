name: Deploy lib

on:
  push:
    tags:
      - '[0-9]*.*.*'

jobs:
  notify-start:
    name: Notify deploy started
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          TEXT=$(cat <<'EOF'
          🚀 *Heleket SDK NestJS — публикация начата*

          📦 Пакет: `@tsforge7/heleket-sdk-nestjs`
          _NestJS-модуль для крипто-платёжной системы Heleket: обёртка над heleket-sdk с DI и декоратором @InjectHeleket()_

          🏷 Версия: `${{ github.ref_name }}`
          👤 Автор: ${{ github.actor }}
          🔀 Коммит: `${{ github.sha }}`

          [Репозиторий](https://github.com/${{ github.repository }}) • [Ход сборки](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )
          curl -sS "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${TEXT}"

  build:
    name: Lint, build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish package on NPM
        run: npm publish --access public --provenance

  notify-success:
    name: Notify published
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          TEXT=$(cat <<'EOF'
          ✅ *Heleket SDK NestJS ${{ github.ref_name }} опубликован в npm*

          📦 `npm install @tsforge7/heleket-sdk-nestjs@${{ github.ref_name }}`

          👤 Автор релиза: ${{ github.actor }}
          🔀 Коммит: `${{ github.sha }}`

          [Пакет в npm](https://www.npmjs.com/package/@tsforge7/heleket-sdk-nestjs) • [Репозиторий](https://github.com/${{ github.repository }})
          EOF
          )
          curl -sS "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${TEXT}"

  notify-error:
    name: Notify failure
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send error notification
        run: |
          TEXT=$(cat <<'EOF'
          ❌ *Heleket SDK NestJS ${{ github.ref_name }} — публикация упала*

          Один из шагов (линт / сборка / publish) завершился с ошибкой.

          👤 Автор: ${{ github.actor }}
          🔀 Коммит: `${{ github.sha }}`

          [Смотреть логи](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )
          curl -sS "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${TEXT}"
